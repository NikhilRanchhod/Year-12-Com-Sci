<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App</title>
    <link rel="stylesheet" href="stylesmobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>


<body>
    <!--Main page content-->
    <div class="page-content">
        <!--Page title-->
        <h1 class="pagetitleschedule">Schedule</h1>
        <!--Calendar and event section-->
        <div class="calendar-wrap">
             <!--calendar section-->
            <div class="calendar">
                 <!--sorting months-->
                <div class="month">
                     <!-- button to back a month-->
                    <button class="month-nav" onclick="changeMonth(-1)">&#10094;</button>
                     <!--shows the current year and month-->
                    <span id="monthLabel">July 2026</span>
                     <!--button to go to the next month-->
                    <button class="month-nav" onclick="changeMonth(1)">&#10095;</button>
                </div>
                <!--shows the days of the week-->
                <div class="weekdays">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                 <!--calendar days added using javascript-->
                <div class="days" id="daysGrid"></div>
            </div>
            <!--Adding events-->
            <div class="event-panel">
                <!--shows the date selected on the calendar-->
                <h2 id="selectedDateLabel">Select a date</h2>
                <div id="eventList" class="event-list"></div>
                <!--form add events-->
                <form id="eventForm" onsubmit="addEvent(event)">
                    <!--even title-->
                    <label for="eventTitle">Event title</label>
                    <input type="text" id="eventTitle" placeholder="Event title" required>
                    <!--able to select a time-->
                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime">
                    <!--add a description for the event-->
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" rows="3" placeholder="Optional description"></textarea>
                    <!--button to add the event to the calendar-->
                    <button type="submit" class="save-btn">Add Event</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        //get todays date
        const today = new Date();
        //stores the current month and year
        let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedDate = null;
        //loads the calendar events from storage
        let events = JSON.parse(localStorage.getItem('calendarEvents') || '{}');
        // make the date into a readable format 
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        // any event added will be save to the local storage
        function saveEvents() {
            localStorage.setItem('calendarEvents', JSON.stringify(events));
        }
        // renders the calendar
        function renderCalendar() {
            // gets the month and year to display on the calendar
            const monthLabel = document.getElementById('monthLabel');
            const daysGrid = document.getElementById('daysGrid');
            // months
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            //shows the current month
            monthLabel.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            // unhighlights the bay before
            daysGrid.innerHTML = '';
            //finds the first day the month starts on 
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
            //gets the last day the month ends on
            const lastDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            // leaves the space for the days before the month starts empty so it alines with the actual days
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                daysGrid.appendChild(empty);
            }
            // adds each day of the month 
            for (let day = 1; day <= lastDate; day++) {
                const cell = document.createElement('div');
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
                const dateKey = formatDateKey(date);
                // gets any events saved for this day 
                const dayEvents = events[dateKey] || [];
                //shows the day number 
                cell.textContent = day;
                // checks if the day is todays date
                if (
                    day === today.getDate() &&
                    currentDate.getMonth() === today.getMonth() &&
                    currentDate.getFullYear() === today.getFullYear()
                ) {
                    cell.classList.add('today');
                }

                if (selectedDate === dateKey) {
                    cell.classList.add('selected-day');
                }
                // adds a dot when a event have been added to the day so you can see it
                if (dayEvents.length > 0) {
                    cell.innerHTML = `${day}<span class="event-dot"></span>`;
                }
                // selects the date when user clicks on it 
                cell.onclick = () => selectDate(dateKey);
                //adds the day to the calendar
                daysGrid.appendChild(cell);
            }
        }
        // displays events for the selected date
        function selectDate(dateKey) {
            selectedDate = dateKey;
            const date = new Date(dateKey + 'T00:00:00');
            const label = document.getElementById('selectedDateLabel');
            label.textContent = date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            showEventsForDate(dateKey);
            renderCalendar();
        }
        // displays events for the selected date
        function showEventsForDate(dateKey) {
            const eventList = document.getElementById('eventList');
            const dateEvents = events[dateKey] || [];
            // if there are no events display a messages saying there a not events
            if (dateEvents.length === 0) {
                eventList.innerHTML = '<p>No events yet.</p>';
                return;
            }
            // displays each event
            eventList.innerHTML = dateEvents.map(event => `
                <div class="event-item">
                    <strong>${event.title}</strong>
                    <small>${event.time || 'All day'}</small>
                    <div>${event.description || ''}</div>
                </div>
            `).join('');
        }
        //adds a new events to the calendar
        function addEvent(e) {
            //doesn't let you refresh the page
            e.preventDefault();
            // ensures the users selects a date before adding a event
            if (!selectedDate) {
                alert('Please select a date first.');
                return;
            }
            // gets information entered the form 
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const description = document.getElementById('eventDescription').value.trim();
            // doesn't submit the event if there is not title entered
            if (!title) {
                alert('Please add an event title.');
                return;
            }
            // empty if date doesn't have any events
            if (!events[selectedDate]) {
                events[selectedDate] = [];
            }
            // new evented to the selected date
            events[selectedDate].push({
                title,
                time,
                description
            });
            //saves the updated events  
            saveEvents();
            showEventsForDate(selectedDate);
            document.getElementById('eventForm').reset();
            renderCalendar();
        }
        // changes the month when the user clicks next or back button   
        function changeMonth(offset) {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
            renderCalendar();
        }
        // displays calendar when page loads
        renderCalendar();
    </script>
    <!--Botton nav bar-->
    <nav class="nav-bottom">
        <a class="nav" href="classlist.html">Class List</a>
        <a class="nav" href="index.html">Scanner</a>
        <a class="nav" href="schedule.html">Schedule</a>
        <a class="nav" href="admin.html">Admin</a>
    </nav>
</body>
</html>
